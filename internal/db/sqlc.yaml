version: "2"
sql:
  - engine: "postgresql"
    queries: "query"
    schema: "migrations"
    gen:
      go:
        package: "db"
        out: "query"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "numeric"
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Numeric"
